rules:
  - id: csreview.javascript.security.eval-detected
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: Dynamic eval can execute attacker-controlled code.
    patterns:
      - pattern: eval(...)
    metadata:
      impact: HIGH
      cwe:
        - "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      owasp:
        - "A03:2021 - Injection"
      references:
        - https://cwe.mitre.org/data/definitions/95.html
      license: MIT

  - id: csreview.python.security.pickle-loads
    languages:
      - python
    severity: ERROR
    message: Deserializing untrusted pickle data can execute arbitrary code.
    patterns:
      - pattern: pickle.loads(...)
    metadata:
      impact: HIGH
      cwe:
        - "CWE-502: Deserialization of Untrusted Data"
      owasp:
        - "A08:2021 - Software and Data Integrity Failures"
      references:
        - https://cwe.mitre.org/data/definitions/502.html
      license: MIT
